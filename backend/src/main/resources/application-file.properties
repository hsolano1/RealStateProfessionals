# File-based storage configuration
app.storage.type=file

# Completely disable database auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Disable JPA/Hibernate completely
spring.jpa.database-platform=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Dummy datasource to prevent initialization errors (won't be used)
spring.datasource.url=jdbc:h2:mem:dummy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=1

# Server configuration
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=WARN
logging.level.com.realestate=INFO
logging.level.org.springframework.boot.autoconfigure=OFF
logging.level.org.hibernate=OFF
